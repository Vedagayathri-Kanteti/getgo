<html>
<head>
<title></title>
<style>
*{
padding:3px;
margin:0;
font-family:Georgia;
text-decoration:none; 
color:#000000;
}
.container{
display:flex;
padding:20px;
}
.box{
width:350px;
height:350px;
margin:20px;
overflow:hidden;
cursor:pointer;
}
.box img {
width:350px;
height:310px;
object-fit:cover;
transition-property:width,height;
transition-duration:0.3s;
transition-timing-function:ease;
transition-delay:0s;
}
.box img:hover {
    width: 350px;
    height: 360px;
}
.container2{
display:flex;
padding:20px;
}
.box3{
width:250px;
height:130px;
margin:0px;
overflow:hidden;
cursor:pointer;
}
.box3 img {
width:250px;
height:130px;
object-fit:cover;
}
</style>
</head>
<body>
<div class="container2">

<div class="box3"><img src="jordan(logo).jpeg"><br><a href="#" style="font-family:Arial;"></a></div>

</div>

<div class="container">

</div>

</div>

</div>
</body>
</html>
